<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="55%" stop-color="#f1f1f4"/>
      <stop offset="100%" stop-color="#e6e6ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="250" fill="url(#glow)"/>

  <!-- 极简烟花：放射状光束 + 中心点，全部用浅灰，保持克制的 Apple 灰阶语言 -->
  <g stroke="#c9c9d1" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="400" y1="212" x2="400" y2="272"/>
    <line x1="400" y1="428" x2="400" y2="492"/>
    <line x1="262" y1="350" x2="322" y2="350"/>
    <line x1="478" y1="350" x2="538" y2="350"/>
    <line x1="302" y1="252" x2="344" y2="294"/>
    <line x1="456" y1="406" x2="498" y2="448"/>
    <line x1="498" y1="252" x2="456" y2="294"/>
    <line x1="344" y1="406" x2="302" y2="448"/>
  </g>
  <!-- 斜向短光束 -->
  <g stroke="#dcdce2" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="330" y1="222" x2="356" y2="258"/>
    <line x1="470" y1="222" x2="444" y2="258"/>
    <line x1="330" y1="478" x2="356" y2="442"/>
    <line x1="470" y1="478" x2="444" y2="442"/>
  </g>
  <circle cx="400" cy="350" r="15" fill="#b9b9c3"/>

  <text x="400" y="600" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" fill="#a1a1a6" text-anchor="middle" letter-spacing="1">商品图</text>
</svg>
